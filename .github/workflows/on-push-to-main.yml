name: On push to main branch
on:
  push:
    branches: [main]

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MOMENTO_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOMENTO_RELEASE_APP_PRIVATE_KEY }}

      - name: Setup repo
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate README
        uses: momentohq/standards-and-practices/github-actions/generate-and-commit-oss-readme@gh-actions-v1
        with:
          project_status: official
          project_stability: alpha
          project_type: other